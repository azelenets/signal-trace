<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.1" cy="0" r="0.8">
      <stop offset="0%" stop-color="#0e1a21"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#00f3ff" stroke-opacity="0.05" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="36" stroke="#00f3ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="rowClip">
      <rect x="613" y="80" width="547" height="310"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- Outer HUD panel -->
  <rect x="20" y="20" width="1160" height="440" fill="#0c1014" fill-opacity="0.84" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- HUD corner accents -->
  <polyline points="20,44 20,20 44,20"   fill="none" stroke="#00f3ff" stroke-opacity="0.7" stroke-width="2"/>
  <polyline points="1156,20 1180,20 1180,44" fill="none" stroke="#00f3ff" stroke-opacity="0.7" stroke-width="2"/>
  <polyline points="20,436 20,460 44,460"   fill="none" stroke="#00f3ff" stroke-opacity="0.7" stroke-width="2"/>
  <polyline points="1156,460 1180,460 1180,436" fill="none" stroke="#00f3ff" stroke-opacity="0.7" stroke-width="2"/>

  <!-- ─── LEFT BRANDING ─── -->

  <!-- Eyebrow -->
  <text x="52" y="72" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#88a4af" letter-spacing="3">R&amp;D // EXPERIMENTAL LAB</text>
  <!-- Eyebrow underline -->
  <line x1="52" y1="80" x2="240" y2="80" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Title -->
  <text x="52" y="198" font-family="'IBM Plex Mono',monospace" font-size="70" font-weight="700" fill="#d5e3e9" letter-spacing="2">SIGNAL</text>
  <text x="52" y="278" font-family="'IBM Plex Mono',monospace" font-size="70" font-weight="700" fill="#fbbf24" letter-spacing="2">TRACE</text>

  <!-- Tagline -->
  <text x="52" y="322" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#88a4af">Browser-based WebSocket inspector</text>
  <text x="52" y="344" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#88a4af">for real-time IoT debugging.</text>

  <!-- Tech chips -->
  <rect x="52"  y="375" width="92" height="22" fill="none" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1"/>
  <text x="98"  y="390" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#9ab5c0" text-anchor="middle">WebSocket</text>

  <rect x="152" y="375" width="62" height="22" fill="none" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1"/>
  <text x="183" y="390" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#9ab5c0" text-anchor="middle">React</text>

  <rect x="222" y="375" width="96" height="22" fill="none" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1"/>
  <text x="270" y="390" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#9ab5c0" text-anchor="middle">TypeScript</text>

  <rect x="326" y="375" width="46" height="22" fill="none" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1"/>
  <text x="349" y="390" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#9ab5c0" text-anchor="middle">IoT</text>

  <!-- Status -->
  <circle cx="52" cy="438" r="4" fill="#4ade80"/>
  <text x="64" y="442" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#88a4af" letter-spacing="1">CONNECTED</text>

  <!-- Vertical separator -->
  <line x1="592" y1="44" x2="592" y2="436" stroke="#00f3ff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ─── RIGHT: MESSAGE TIMELINE ─── -->

  <!-- Header -->
